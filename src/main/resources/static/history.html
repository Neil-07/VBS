<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - Virtual Banking System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .header {
            background: linear-gradient(135deg, #3730a3 0%, #4338ca 100%);
            padding: 30px;
            color: #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .header h1 { font-size: 28px; font-weight: 600; color: #f1f5f9; }

        .btn-header {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            border: 1px solid #f1f5f9;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-header:hover {
            background: #f1f5f9;
            color: #3730a3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .content { padding: 40px 30px; }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            background: #0f172a;
            padding: 20px;
            border: 1px solid #334155;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
        }

        .history-table thead {
            background: linear-gradient(135deg, #3730a3 0%, #4338ca 100%);
            color: #f1f5f9;
        }

        .history-table th {
            padding: 16px 15px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            color: #f1f5f9;
        }

        .history-table tbody tr {
            border-bottom: 1px solid #334155;
            transition: all 0.2s ease;
            background: #1e293b;
        }

        .history-table tbody tr:hover { background-color: #334155; }

        .history-table td {
            padding: 14px 15px;
            font-size: 14px;
            color: #f1f5f9;
        }

        .history-table td:first-child {
            font-weight: 600;
            color: #4f46e5;
            width: 60px;
        }

        .date { color: #94a3b8; font-size: 12px; white-space: nowrap; }

        .history-empty {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 15px; text-align: center; }
            .header h1 { font-size: 22px; }
            .history-table th, .history-table td { padding: 10px; font-size: 12px; }
            .content { padding: 20px 15px; }
            .table-wrapper { padding: 10px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>History</h1>
        <div>
            <button class="btn-header" onclick="goBack()">← Back</button>
        </div>
    </div>
    <div class="content">
        <div id="historyMessage" class="history-empty" style="display:none"></div>
        <div class="table-wrapper">
            <table class="history-table" id="historyTable">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Description</th>
                    <th>Date</th>
                </tr>
                </thead>
                <tbody id="historyBody">
                <tr>
                    <td colspan="3" class="history-empty">Loading history...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = '';
    let userId = null;

    function getUserIdFromURL() {
        const params = new URLSearchParams(window.location.search);
        const urlUserId = params.get('id');
        const urlRole = params.get('role');

        const storedUserId = localStorage.getItem('userId');
        const storedRole = localStorage.getItem('role');

        userId = storedUserId || urlUserId;
        const role = (storedRole || urlRole || '').toLowerCase();

        // Always keep localStorage in sync
        if (userId) localStorage.setItem('userId', userId);
        if (role)   localStorage.setItem('role', role);
    }

    // Goes back to the correct dashboard based on role
    function goBack() {
        const role = localStorage.getItem('role') || '';
        const params = new URLSearchParams();
        if (userId) params.set('id', userId);
        params.set('role', role);

        if (role === 'manager') {
            window.location.href = `manager.html?${params.toString()}`;
        } else {
            window.location.href = `admin.html?${params.toString()}`;
        }
    }

    async function loadHistories() {
        try {
            const res = await fetch(`${API_URL}/histories`);
            if (!res.ok) throw new Error('Failed to load histories');
            const histories = await res.json();
            renderHistories(histories);
        } catch (err) {
            console.error(err);
            const body = document.getElementById('historyBody');
            body.innerHTML = `<tr><td colspan="3" class="history-empty">Unable to load history. Ensure backend is running.</td></tr>`;
        }
    }

    function renderHistories(list) {
        const body = document.getElementById('historyBody');
        if (!list || list.length === 0) {
            body.innerHTML = `<tr><td colspan="3" class="history-empty">No history records found.</td></tr>`;
            return;
        }

        body.innerHTML = list.map(h => `
            <tr>
                <td>#${h.id}</td>
                <td>${escapeHtml(h.description)}</td>
                <td class="date">${formatDate(h.date)}</td>
            </tr>
        `).join('');
    }

    function formatDate(d) {
        if (!d) return '';
        const dt = new Date(d);
        if (isNaN(dt)) return d;
        return dt.toLocaleString();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"']/g, function(c) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c];
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        getUserIdFromURL();
        loadHistories();
    });
</script>
</body>
</html>
