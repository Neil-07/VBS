<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBS - Manager Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f1f5f9;
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            height: calc(100vh - 40px);
            max-height: 900px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
        }

        .sidebar {
            width: 35%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #334155;
            background: #1e293b;
        }

        .sidebar-header {
            background: linear-gradient(135deg, #3730a3 0%, #4338ca 100%);
            padding: 15px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h1 {
            font-size: 22px;
        }

        .chat-list {
            flex-grow: 1;
            overflow-y: auto;
            background: #0f172a;
        }
        
        .chat-list-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid #334155;
            transition: background-color 0.3s;
        }

        .chat-list-item:hover {
            background-color: #1e293b;
        }

        .chat-list-item.active {
            background-color: #334155;
        }

        .chat-list-item .user-name {
            font-weight: 600;
            color: #f1f5f9;
        }

        .chat-area {
            width: 65%;
            display: flex;
            flex-direction: column;
            background: #1e293b;
        }

        .header {
            background: linear-gradient(135deg, #3730a3 0%, #4338ca 100%);
            padding: 15px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 22px;
            margin-bottom: 2px;
        }

        .header-left p {
            font-size: 13px;
            opacity: 0.9;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background: #0f172a;
            display: flex;
            flex-direction: column;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .bubble {
            padding: 12px 18px;
            border-radius: 12px;
            line-height: 1.5;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .timestamp {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 5px;
        }

        .message.sent {
            align-self: flex-end;
        }
        .message.sent .bubble {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: white;
        }
        .message.sent .timestamp {
            align-self: flex-end;
        }

        .message.received {
            align-self: flex-start;
        }
        .message.received .bubble {
            background: #334155;
            color: #f1f5f9;
        }
        .message.received .timestamp {
            align-self: flex-start;
        }

        .chat-input-area {
            padding: 15px;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 15px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            color: #f1f5f9;
            transition: border-color 0.3s;
        }

        .chat-input-area input:focus {
            outline: none;
            border-color: #6366f1;
        }

        .btn-send {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: white;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
        }

        .btn-back {
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
        }

        .btn-back:hover {
            background: white;
            color: #3730a3;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>Chats</h1>
                <a href="manager.html" class="btn-back">Back</a>
            </div>
            <div class="chat-list">
                <div class="chat-list-item active">
                    <div class="user-name">Neil Joseph</div>
                </div>
                <div class="chat-list-item">
                    <div class="user-name">Neil</div>
                </div>
                <div class="chat-list-item">
                    <div class="user-name">Dylan</div>
                </div>
            </div>
        </div>
        <div class="chat-area">
            <div class="header">
                <div class="header-left">
                    <h1>Chat with Neil Joseph</h1>
                    <p>Online</p>
                </div>
            </div>
            <div class="chat-messages">
                <div class="message received">
                    <div class="bubble">Hi, I have a question about my last transaction.</div>
                    <div class="timestamp">10:02 AM</div>
                </div>
                <div class="message sent">
                    <div class="bubble">Sure, I can help with that. Could you provide the transaction ID?</div>
                    <div class="timestamp">10:05 AM</div>
                </div>
                <div class="message received">
                    <div class="bubble">Yes, it's TXN123456.</div>
                    <div class="timestamp">10:07 AM</div>
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" placeholder="Type your message...">
                <button class="btn-send">Send</button>
            </div>
        </div>
    </div>
</body>
</html>
